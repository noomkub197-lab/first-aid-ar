
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>WebAR ปฐมพยาบาล 7 หน้า</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #guide {
      position: fixed;
      z-index: 99999;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 12px;
      border-radius: 14px;
      background: white;
      color: #333;
      text-align: center;
      box-shadow: 0 2px 10px #0002;
      pointer-events: none;
    }

    #pageInfo {
      position: fixed;
      z-index: 99999;
      left: 12px;
      right: 12px;
      bottom: 90px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      text-align: center;
      pointer-events: none;
    }

    #controls {
      position: fixed;
      z-index: 100000;
      left: 12px;
      right: 12px;
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
    }

    #controls button {
      flex: 1;
      max-width: 220px;
      min-height: 52px;
      padding: 12px 8px;
      border: none;
      border-radius: 12px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #controls button:disabled {
      background: #888;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div id="guide">
    🩹 กำลังเตรียมกล้อง กรุณารอสักครู่
  </div>

  <div id="pageInfo">หน้า 1 / 7</div>

  <div id="controls">
    <button id="prevBtn" type="button" disabled>
      ◀ ย้อนกลับ
    </button>

    <button id="nextBtn" type="button">
      ถัดไป ▶
    </button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- โหลดภาพทั้งหมด -->
    <a-assets timeout="30000">
      <img id="poster" src="./Thai First Aid Guide Infographic.png">

      <img id="step1" src="./page1.png">
      <img id="step2" src="./page2.png">
      <img id="step3" src="./page3.png">
      <img id="step4" src="./page4.png">
      <img id="step5" src="./page5.png">
      <img id="step6" src="./page6.png">
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- ใช้ Target เดิมสำหรับตรวจจับโปสเตอร์ -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- หน้า 1: โปสเตอร์รวม -->
      <a-image
        id="arPoster"
        src="#poster"
        position="0 0 0.05"
        width="1"
        height="1.5"
        material="shader: flat; transparent: true; side: double"
        visible="true">
      </a-image>

      <!-- หน้า 2: ขั้นตอนที่ 1 -->
      <a-image
        id="arPage1"
        src="#step1"
        position="0 0 0.05"
        width="1"
        height="1"
        material="shader: flat; transparent: true; side: double"
        visible="false">
      </a-image>

      <!-- หน้า 3: ขั้นตอนที่ 2 -->
      <a-image
        id="arPage2"
        src="#step2"
        position="0 0 0.05"
        width="1"
        height="1"
        material="shader: flat; transparent: true; side: double"
        visible="false">
      </a-image>

      <!-- หน้า 4: ขั้นตอนที่ 3 -->
      <a-image
        id="arPage3"
        src="#step3"
        position="0 0 0.05"
        width="1"
        height="1"
        material="shader: flat; transparent: true; side: double"
        visible="false">
      </a-image>

      <!-- หน้า 5: ขั้นตอนที่ 4 -->
      <a-image
        id="arPage4"
        src="#step4"
        position="0 0 0.05"
        width="1"
        height="1"
        material="shader: flat; transparent: true; side: double"
        visible="false">
      </a-image>

      <!-- หน้า 6: ขั้นตอนที่ 5 -->
      <a-image
        id="arPage5"
        src="#step5"
        position="0 0 0.05"
        width="1"
        height="1"
        material="shader: flat; transparent: true; side: double"
        visible="false">
      </a-image>

      <!-- หน้า 7: ขั้นตอนที่ 6 -->
      <a-image
        id="arPage6"
        src="#step6"
        position="0 0 0.05"
        width="1"
        height="1"
        material="shader: flat; transparent: true; side: double"
        visible="false">
      </a-image>

    </a-entity>
  </a-scene>

  <script>
    (() => {
      "use strict";

      const guide = document.getElementById("guide");
      const pageInfo = document.getElementById("pageInfo");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      // เรียงลำดับภาพทั้ง 7 หน้า
      const pages = [
        document.getElementById("arPoster"),
        document.getElementById("arPage1"),
        document.getElementById("arPage2"),
        document.getElementById("arPage3"),
        document.getElementById("arPage4"),
        document.getElementById("arPage5"),
        document.getElementById("arPage6")
      ];

      let currentPage = 0;

      // ตรวจสอบว่าองค์ประกอบภาพครบ
      if (pages.some(page => page === null)) {
        guide.textContent =
          "เกิดข้อผิดพลาด: ตรวจสอบโค้ดภาพทั้ง 7 หน้า";
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }

      // เปลี่ยนภาพและอัปเดตหมายเลขหน้า
      function updatePage() {
        pages.forEach((page, index) => {
          const shouldShow = index === currentPage;

          page.setAttribute("visible", shouldShow);

          if (page.object3D) {
            page.object3D.visible = shouldShow;
          }
        });

        pageInfo.textContent =
          "หน้า " + (currentPage + 1) + " / " + pages.length;

        prevBtn.disabled = currentPage === 0;
        nextBtn.disabled = currentPage === pages.length - 1;
      }

      // ไปหน้าถัดไป
      nextBtn.addEventListener("click", function (event) {
        event.preventDefault();

        if (currentPage < pages.length - 1) {
          currentPage++;
          updatePage();
        }
      });

      // กลับหน้าก่อนหน้า
      prevBtn.addEventListener("click", function (event) {
        event.preventDefault();

        if (currentPage > 0) {
          currentPage--;
          updatePage();
        }
      });

      // เริ่มต้นที่หน้า 1
      updatePage();

      // ตรวจจับโปสเตอร์ด้วย Target เดิม
      const target = document.querySelector(
        "[mindar-image-target]"
      );

      if (target) {
        target.addEventListener("targetFound", function () {
          guide.textContent =
            "พบโปสเตอร์แล้ว — กดถัดไปเพื่อดูขั้นตอน";
        });

        target.addEventListener("targetLost", function () {
          guide.textContent =
            "ส่องกล้องไปที่โปสเตอร์ปฐมพยาบาล";
        });
      }

      // แจ้งเตือนเมื่อไฟล์ภาพโหลดไม่สำเร็จ
      const imageIds = [
        "poster",
        "step1",
        "step2",
        "step3",
        "step4",
        "step5",
        "step6"
      ];

      imageIds.forEach(id => {
        const image = document.getElementById(id);

        image.addEventListener("error", function () {
          guide.textContent =
            "โหลดภาพไม่สำเร็จ: " + image.getAttribute("src");
        });
      });

    })();
  </script>

</body>
</html>
