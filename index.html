
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>WebAR ปฐมพยาบาล 6 ขั้นตอน</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* ฉาก AR อยู่ด้านหลังปุ่ม */
    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #guide {
      position: fixed;
      z-index: 99999;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 12px;
      border-radius: 14px;
      background: white;
      color: #333;
      text-align: center;
      box-shadow: 0 2px 10px #0002;
      pointer-events: none;
    }

    #pageInfo {
      position: fixed;
      z-index: 99999;
      bottom: 90px;
      left: 12px;
      right: 12px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      text-align: center;
      pointer-events: none;
    }

    #controls {
      position: fixed;
      z-index: 100000;
      left: 12px;
      right: 12px;
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
    }

    #controls button {
      flex: 1;
      max-width: 220px;
      min-height: 52px;
      padding: 12px 8px;
      border: none;
      border-radius: 12px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #controls button:disabled {
      background: #888;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div id="guide">
    🩹 กำลังเตรียมกล้อง กรุณารอสักครู่
  </div>

  <div id="pageInfo">หน้า 1 / 6</div>

  <div id="controls">
    <button id="prevBtn" type="button" disabled>
      ◀ ย้อนกลับ
    </button>

    <button id="nextBtn" type="button">
      ถัดไป ▶
    </button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="30000">
      <img id="page1" src="./page1.png">
      <img id="page2" src="./page2.png">
      <img id="page3" src="./page3.png">
      <img id="page4" src="./page4.png">
      <img id="page5" src="./page5.png">
      <img id="page6" src="./page6.png">
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-image id="arPage1"
        src="#page1"
        position="0 0 0.05"
        width="1"
        height="1"
        material="shader: flat; transparent: true; side: double"
        visible="true">
      </a-image>

      <a-image id="arPage2"
        src="#page2"
        position="0 0 0.05"
        width="1"
        height="1"
        material="shader: flat; transparent: true; side: double"
        visible="false">
      </a-image>

      <a-image id="arPage3"
        src="#page3"
        position="0 0 0.05"
        width="1"
        height="1"
        material="shader: flat; transparent: true; side: double"
        visible="false">
      </a-image>

      <a-image id="arPage4"
        src="#page4"
        position="0 0 0.05"
        width="1"
        height="1"
        material="shader: flat; transparent: true; side: double"
        visible="false">
      </a-image>

      <a-image id="arPage5"
        src="#page5"
        position="0 0 0.05"
        width="1"
        height="1"
        material="shader: flat; transparent: true; side: double"
        visible="false">
      </a-image>

      <a-image id="arPage6"
        src="#page6"
        position="0 0 0.05"
        width="1"
        height="1"
        material="shader: flat; transparent: true; side: double"
        visible="false">
      </a-image>

    </a-entity>
  </a-scene>

  <script>
    (() => {
      const guide = document.getElementById("guide");
      const pageInfo = document.getElementById("pageInfo");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      const pages = [
        document.getElementById("arPage1"),
        document.getElementById("arPage2"),
        document.getElementById("arPage3"),
        document.getElementById("arPage4"),
        document.getElementById("arPage5"),
        document.getElementById("arPage6")
      ];

      let currentPage = 0;

function setOriginalImageSizes() {
  pages.forEach((page) => {
    if (!page) return;

    const imageId = page.getAttribute("src").replace("#", "");
    const image = document.getElementById(imageId);

    function applySize() {
      if (!image || !image.naturalWidth || !image.naturalHeight) {
        return;
      }

      // กำหนดความกว้างมาตรฐาน แล้วคำนวณความสูงตามต้นฉบับ
      const width = 1;
      const height = width * image.naturalHeight / image.naturalWidth;

      page.setAttribute("width", width);
      page.setAttribute("height", height);
    }

    if (image && image.complete) {
      applySize();
    } else if (image) {
      image.addEventListener("load", applySize, { once: true });
    }
  });
}

      
      // แสดงภาพตามหน้าที่เลือก
      function updatePage() {
        pages.forEach((page, index) => {
          const show = index === currentPage;

          if (page) {
            page.setAttribute("visible", show);

            if (page.object3D) {
              page.object3D.visible = show;
            }
          }
        });

        pageInfo.textContent =
          "หน้า " + (currentPage + 1) + " / " + pages.length;

        prevBtn.disabled = currentPage === 0;
        nextBtn.disabled = currentPage === pages.length - 1;
      }

      // ไปหน้าถัดไป
      nextBtn.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();

        if (currentPage < pages.length - 1) {
          currentPage += 1;
          updatePage();
        }
      });

      // กลับหน้าก่อนหน้า
      prevBtn.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();

        if (currentPage > 0) {
          currentPage -= 1;
          updatePage();
        }
      });

      // แสดงข้อความสถานะการตรวจจับโปสเตอร์
      const target = document.querySelector(
        "[mindar-image-target]"
      );

      if (target) {
        target.addEventListener("targetFound", function () {
          guide.textContent =
            "พบโปสเตอร์แล้ว — กดถัดไปเพื่อดูขั้นตอน";
        });

        target.addEventListener("targetLost", function () {
          guide.textContent =
            "ส่องกล้องไปที่โปสเตอร์ปฐมพยาบาล";
        });
      }

     // ปรับสัดส่วนภาพตามต้นฉบับทุกหน้า
setOriginalImageSizes();

// เริ่มต้นหน้าแรก
updatePage();
      
      // แจ้งเตือนหากหาองค์ประกอบภาพไม่ครบ
      if (pages.some(page => !page)) {
        guide.textContent =
          "เกิดข้อผิดพลาดในการเตรียมภาพ กรุณาตรวจสอบโค้ด";
      }
    })();
  </script>

</body>
</html>
