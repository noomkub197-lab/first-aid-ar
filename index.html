
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>WebAR ปฐมพยาบาล 6 ขั้นตอน</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
    }

    #guide {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 12px;
      border-radius: 14px;
      background: white;
      color: #333;
      text-align: center;
      box-shadow: 0 2px 10px #0002;
    }

    #controls {
      position: fixed;
      z-index: 20;
      left: 12px;
      right: 12px;
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }

    #controls button {
      flex: 1;
      max-width: 220px;
      padding: 14px 10px;
      border: 0;
      border-radius: 12px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #controls button:disabled {
      background: #999;
      cursor: default;
    }

    #pageInfo {
      position: fixed;
      z-index: 20;
      bottom: 82px;
      left: 12px;
      right: 12px;
      text-align: center;
      color: white;
      background: #0009;
      padding: 8px;
      border-radius: 10px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="guide">
    🩹 ส่องกล้องไปที่โปสเตอร์ปฐมพยาบาล
  </div>

  <div id="pageInfo">หน้า 1 / 6</div>

  <div id="controls">
    <button id="prevBtn" type="button" disabled>
      ◀ ย้อนกลับ
    </button>
    <button id="nextBtn" type="button">
      ถัดไป ▶
    </button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="15000">
  <img id="page1" src="./page1.png" crossorigin="anonymous">
  <img id="page2" src="./page2.png" crossorigin="anonymous">
  <img id="page3" src="./page3.png" crossorigin="anonymous">
  <img id="page4" src="./page4.png" crossorigin="anonymous">
  <img id="page5" src="./page5.png" crossorigin="anonymous">
  <img id="page6" src="./page6.png" crossorigin="anonymous">
</a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

   
<a-entity mindar-image-target="targetIndex: 0">
  <a-image id="arPage1"
    src="#page1"
    position="0 0 0.05"
    width="1" height="1.5"
    material="shader: flat; transparent: true; side: double"
    visible="true">
  </a-image>

  <a-image id="arPage2"
    src="#page2"
    position="0 0 0.05"
    width="1" height="1.5"
    material="shader: flat; transparent: true; side: double"
    visible="false">
  </a-image>

  <a-image id="arPage3"
    src="#page3"
    position="0 0 0.05"
    width="1" height="1.5"
    material="shader: flat; transparent: true; side: double"
    visible="false">
  </a-image>

  <a-image id="arPage4"
    src="#page4"
    position="0 0 0.05"
    width="1" height="1.5"
    material="shader: flat; transparent: true; side: double"
    visible="false">
  </a-image>

  <a-image id="arPage5"
    src="#page5"
    position="0 0 0.05"
    width="1" height="1.5"
    material="shader: flat; transparent: true; side: double"
    visible="false">
  </a-image>

  <a-image id="arPage6"
    src="#page6"
    position="0 0 0.05"
    width="1" height="1.5"
    material="shader: flat; transparent: true; side: double"
    visible="false">
  </a-image>
</a-entity>

  </a-scene>

  <script>
    const images = [
      "#page1",
      "#page2",
      "#page3",
      "#page4",
      "#page5",
      "#page6"
    ];

    let currentPage = 0;
    let targetVisible = false;

  
    const guide = document.getElementById("guide");
    const pageInfo = document.getElementById("pageInfo");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");


let imageRequestId = 0;


const pages = Array.from(
  { length: 6 },
  (_, i) => document.getElementById(`arPage${i + 1}`)
);


function updatePage() {
  const scene = document.querySelector("a-scene");

  pageInfo.textContent =
    `หน้า ${currentPage + 1} / 6`;

  prevBtn.disabled = currentPage === 0;
  nextBtn.disabled = currentPage === 5;

  pages.forEach((page, index) => {
    if (!page) return;

    const isCurrent = index === currentPage;

    // กำหนดการแสดงผลของวัตถุ 3D โดยตรง
    page.object3D.visible = isCurrent;
  });

  console.log("หน้าปัจจุบัน:", currentPage + 1);

  if (!scene.hasLoaded) {
    scene.addEventListener("loaded", updatePage, {
      once: true
    });
  }
}

prevBtn.addEventListener("click", () => {
  if (currentPage > 0) {
    currentPage--;
    updatePage();
  }
});

nextBtn.addEventListener("click", () => {
  if (currentPage < pages.length - 1) {
    currentPage++;
    updatePage();
  }
});

updatePage();
  }
});


    const target = document.querySelector(
      "[mindar-image-target]"
    );

    target.addEventListener("targetFound", () => {
      targetVisible = true;
      guide.textContent =
        "พบโปสเตอร์แล้ว — กดถัดไปเพื่อดูขั้นตอน";
    });

    target.addEventListener("targetLost", () => {
      targetVisible = false;
      guide.textContent =
        "ส่องกล้องไปที่โปสเตอร์ปฐมพยาบาล";
    });

    updatePage();
  </script>
</body>
</html>
