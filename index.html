
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>WebAR ปฐมพยาบาล 6 ขั้นตอน</title>

  <!-- A-Frame และ MindAR -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
    }

    #guide {
      position: fixed;
      z-index: 999;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 12px;
      border-radius: 14px;
      background: white;
      color: #333;
      text-align: center;
      box-shadow: 0 2px 10px #0002;
    }

    #pageInfo {
      position: fixed;
      z-index: 999;
      bottom: 86px;
      left: 12px;
      right: 12px;
      padding: 8px;
      border-radius: 10px;
      background: #0009;
      color: white;
      text-align: center;
      pointer-events: none;
    }

    #controls {
      position: fixed;
      z-index: 1000;
      left: 12px;
      right: 12px;
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    #controls button {
      flex: 1;
      max-width: 220px;
      padding: 14px 10px;
      border: 0;
      border-radius: 12px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    #controls button:disabled {
      background: #999;
      cursor: default;
    }
  </style>
</head>

<body>

  <!-- ข้อความแนะนำ -->
  <div id="guide">
    🩹 ส่องกล้องไปที่โปสเตอร์ปฐมพยาบาล
  </div>

  <!-- หมายเลขหน้า -->
  <div id="pageInfo">หน้า 1 / 6</div>

  <!-- ปุ่มควบคุม -->
  <div id="controls">
    <button id="prevBtn" type="button" disabled>
      ◀ ย้อนกลับ
    </button>

    <button id="nextBtn" type="button">
      ถัดไป ▶
    </button>
  </div>

  <!-- ฉาก AR -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- รูปภาพทั้ง 6 หน้า -->
    <a-assets timeout="20000">
      <img id="page1" src="./page1.png" crossorigin="anonymous">
      <img id="page2" src="./page2.png" crossorigin="anonymous">
      <img id="page3" src="./page3.png" crossorigin="anonymous">
      <img id="page4" src="./page4.png" crossorigin="anonymous">
      <img id="page5" src="./page5.png" crossorigin="anonymous">
      <img id="page6" src="./page6.png" crossorigin="anonymous">
    </a-assets>

    <!-- กล้อง -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- แสดงภาพเมื่อพบโปสเตอร์เป้าหมาย -->
    <a-entity mindar-image-target="targetIndex: 0">

      <a-image
        id="arPage1"
        src="#page1"
        position="0 0 0.05"
        width="1"
        height="1.5"
        material="shader: flat; transparent: true; side: double"
        visible="true">
      </a-image>

      <a-image
        id="arPage2"
        src="#page2"
        position="0 0 0.05"
        width="1"
        height="1.5"
        material="shader: flat; transparent: true; side: double"
        visible="false">
      </a-image>

      <a-image
        id="arPage3"
        src="#page3"
        position="0 0 0.05"
        width="1"
        height="1.5"
        material="shader: flat; transparent: true; side: double"
        visible="false">
      </a-image>

      <a-image
        id="arPage4"
        src="#page4"
        position="0 0 0.05"
        width="1"
        height="1.5"
        material="shader: flat; transparent: true; side: double"
        visible="false">
      </a-image>

      <a-image
        id="arPage5"
        src="#page5"
        position="0 0 0.05"
        width="1"
        height="1.5"
        material="shader: flat; transparent: true; side: double"
        visible="false">
      </a-image>

      <a-image
        id="arPage6"
        src="#page6"
        position="0 0 0.05"
        width="1"
        height="1.5"
        material="shader: flat; transparent: true; side: double"
        visible="false">
      </a-image>

    </a-entity>
  </a-scene>

  <script>
    // เก็บองค์ประกอบ HTML
    const guide = document.getElementById("guide");
    const pageInfo = document.getElementById("pageInfo");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    // เก็บภาพทั้ง 6 หน้า
    const pages = [
      document.getElementById("arPage1"),
      document.getElementById("arPage2"),
      document.getElementById("arPage3"),
      document.getElementById("arPage4"),
      document.getElementById("arPage5"),
      document.getElementById("arPage6")
    ];

    let currentPage = 0;

    // เปลี่ยนภาพและอัปเดตปุ่ม
    function updatePage() {
      pages.forEach((page, index) => {
        if (page) {
          const isCurrentPage = index === currentPage;

          // แสดงเฉพาะภาพของหน้าปัจจุบัน
          page.setAttribute("visible", isCurrentPage);

          // กำหนดการมองเห็นโดยตรงกับวัตถุ 3D ด้วย
          if (page.object3D) {
            page.object3D.visible = isCurrentPage;
          }
        }
      });

      pageInfo.textContent =
        `หน้า ${currentPage + 1} / ${pages.length}`;

      prevBtn.disabled = currentPage === 0;
      nextBtn.disabled = currentPage === pages.length - 1;
    }

    // ปุ่มย้อนกลับ
    prevBtn.addEventListener("click", () => {
      if (currentPage > 0) {
        currentPage--;
        updatePage();
      }
    });

    // ปุ่มถัดไป
    nextBtn.addEventListener("click", () => {
      if (currentPage < pages.length - 1) {
        currentPage++;
        updatePage();
      }
    });

    // แจ้งสถานะเมื่อพบหรือไม่พบโปสเตอร์
    const target = document.querySelector(
      "[mindar-image-target]"
    );

    if (target) {
      target.addEventListener("targetFound", () => {
        guide.textContent =
          "พบโปสเตอร์แล้ว — กดถัดไปเพื่อดูขั้นตอน";
      });

      target.addEventListener("targetLost", () => {
        guide.textContent =
          "ส่องกล้องไปที่โปสเตอร์ปฐมพยาบาล";
      });
    }

    // เริ่มต้นที่หน้า 1
    updatePage();
  </script>

</body>
</html>
