
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>First Aid AR - Hiro Marker</title>

  <!-- A-Frame และ AR.js -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #topbar {
      position: fixed;
      z-index: 10;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .pill {
      padding: 10px 12px;
      border-radius: 20px;
      color: white;
      background: rgba(0, 0, 0, 0.75);
      font-size: 14px;
    }

    #status {
      max-width: 75%;
    }

    #homeLink {
      color: white;
      background: rgba(0, 0, 0, 0.75);
      padding: 10px 12px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
      pointer-events: auto;
      white-space: nowrap;
    }

    #controls {
      position: fixed;
      z-index: 10;
      left: 10px;
      right: 10px;
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    button {
      padding: 12px 15px;
      min-width: 95px;
      border: none;
      border-radius: 12px;
      background: #1769e0;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: 0.45;
    }

    a-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
  </style>
</head>

<body>

  <div id="topbar">
    <div id="status" class="pill">
      กำลังเปิดกล้อง...
    </div>
    <a id="homeLink" href="./index.html">กลับเมนู</a>
  </div>

  <div id="controls">
    <button id="prevBtn" type="button">← ก่อนหน้า</button>
    <div id="pageCount" class="pill">หน้า 1 / 6</div>
    <button id="nextBtn" type="button">ถัดไป →</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
  >

    <a-assets timeout="15000">
      <img id="page1" src="./page1.png">
      <img id="page2" src="./page2.png">
      <img id="page3" src="./page3.png">
      <img id="page4" src="./page4.png">
      <img id="page5" src="./page5.png">
      <img id="page6" src="./page6.png">
    </a-assets>

    <!-- ตรวจจับ Hiro Marker -->
    <a-marker
      id="hiroMarker"
      preset="hiro"
      smooth="true"
      smoothCount="5"
      smoothTolerance="0.01"
      smoothThreshold="2"
    >

      <!-- ภาพคู่มือปฐมพยาบาล -->
      <a-plane
        id="pagePlane"
        position="0 0.05 0"
        rotation="0 0 0"
        width="1"
        height="1.414"
        material="shader: flat; src: #page1; side: double;"
      ></a-plane>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const totalPages = 6;
    let currentPage = 1;

    const plane = document.getElementById("pagePlane");
    const pageCount = document.getElementById("pageCount");
    const status = document.getElementById("status");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const marker = document.getElementById("hiroMarker");
    const scene = document.querySelector("a-scene");

    function showPage(page) {
      currentPage = Math.max(1, Math.min(totalPages, page));

      plane.setAttribute("material", {
        shader: "flat",
        src: "#page" + currentPage,
        side: "double"
      });

      pageCount.textContent =
        "หน้า " + currentPage + " / " + totalPages;

      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages;
    }

    prevBtn.addEventListener("click", function () {
      showPage(currentPage - 1);
    });

    nextBtn.addEventListener("click", function () {
      showPage(currentPage + 1);
    });

    marker.addEventListener("markerFound", function () {
      status.textContent = "พบ Hiro Marker แล้ว";
    });

    marker.addEventListener("markerLost", function () {
      status.textContent = "ไม่พบ Marker กรุณาส่องกล้องไปที่ Marker";
    });

    scene.addEventListener("loaded", function () {
      status.textContent = "กำลังเตรียมกล้อง กรุณารอสักครู่...";
    });

    scene.addEventListener("camera-init", function () {
      status.textContent = "กล้องพร้อมแล้ว กรุณาสแกน Hiro Marker";
    });

    scene.addEventListener("camera-error", function () {
      status.textContent = "เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้อง";
    });

    // แจ้งเตือนหากโหลดภาพไม่สำเร็จ
    for (let i = 1; i <= totalPages; i++) {
      const img = document.getElementById("page" + i);

      img.addEventListener("error", function () {
        status.textContent =
          "โหลด page" + i + ".png ไม่สำเร็จ กรุณาตรวจชื่อไฟล์";
      });
    }

    showPage(1);
  </script>

</body>
</html>
